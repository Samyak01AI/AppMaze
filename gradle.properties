# Project-wide Gradle settings.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Compose strong skipping for better recomposition performance
# This reduces unnecessary recompositions and makes animations smoother
kotlin.compose.strongSkipping=true
